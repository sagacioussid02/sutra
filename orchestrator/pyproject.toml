[project]
name = "sutra-orchestrator"
version = "0.1.0"
description = "Text orchestrator: an LLM agent that talks to the Sutra gateway over MCP"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sutra_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
