# Copy this file to discovery-sources.yaml (gitignored) and fill in real
# projects. Each source is a backend project serving a Sutra Agent Manifest
# at manifest_url (see docs/agent-manifest.md). base_url is what discovered
# tools are actually called against once approved — usually the same host
# as manifest_url, without the /.well-known/sutra-agent.json suffix.
#
# auth_header / auth_env (optional, set both or neither): a header sent on
# every tool call to that source, with its value read from the named
# environment variable at gateway start (deploy/run-gateway.sh loads
# ~/.config/sutra/sutra.env). The value is never written here. If the
# variable is empty the gateway skips the source rather than call it
# without credentials. The manifest itself is always fetched without it.

sources:
  - name: finanxe
    manifest_url: http://127.0.0.1:8002/.well-known/sutra-agent.json
    base_url: http://127.0.0.1:8002
    auth_header: X-Finanxe-Token
    auth_env: FINANXE_API_TOKEN
